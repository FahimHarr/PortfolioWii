// description de l étape dans le texte sous le cadre (+ rappel « Écrire » dans « 1 nouveau message »)
// pages « méthode » : le cadre rétrécit juste ce qu'il faut pour que tout tienne au-dessus de la barre du bas, sans défiler
function fitMethod(){
  const sw=document.querySelector(".stage-wrap"), st=document.getElementById("ch-stage");
  sw.style.width="";
  if(!document.getElementById("channel").classList.contains("open")) return;
  avisSize();
  if(!st.querySelector(".b-method")||innerWidth<761) return;
  // offsetTop/offsetHeight (et pas getBoundingClientRect) : insensibles au zoom d ouverture de la chaîne
  const chan=document.getElementById("channel"), info=document.querySelector(".ch-info");
  const y=el=>{ let v=0; for(let e=el;e&&e!==chan;e=e.offsetParent) v+=e.offsetTop; return v; };
  const bar=innerHeight-document.querySelector(".ch-bar").offsetHeight;
  const gap=y(info)-(y(sw)+sw.offsetHeight);
  const h=bar-16-y(sw)-gap-info.offsetHeight;
  sw.style.width=Math.max(420,Math.min(sw.parentElement.clientWidth,h*16/9))+"px";
}
addEventListener("resize",()=>{ if(document.getElementById("channel").classList.contains("open")) fitMethod(); });
function methodText(i,anim=true){

  const el=document.getElementById("ch-text"), ti=document.getElementById("ch-title"), na=anim?"":" style=\"animation:none\"";

}
// longueur le long de la route la plus proche d'un point (pour savoir où s'arrêter)
function lengthAt(p,x,y){
  const L=p.getTotalLength(); let best=0,bd=1e9;
  for(let k=0;k<=200;k++){ const q=p.getPointAtLength(L*k/200), d=(q.x-x)**2+(q.y-y)**2; if(d<bd){ bd=d; best=L*k/200; } }
  return best;
}
// petites étincelles à l'arrivée du Mii (ou confettis pour la victoire)
function methodBurst(m,x,y,n,cls){
  const fx=m.querySelector(".m-fx"), H=m.clientHeight, cols=["#34b1e4","#ffb02e","#ff5d7a","#4fd16b","#fff","#a35cff"];
  for(let k=0;k<n;k++){
    const s=document.createElement("i"); s.className=cls;
    if(cls==="m-spark"){
      const a=k/n*Math.PI*2;
      s.style.cssText=`left:${x}%;top:${y}%;--dx:${Math.cos(a)*H*.12}px;--dy:${Math.sin(a)*H*.12}px`;
    }else{
      s.style.cssText=`left:${Math.random()*100}%;--dx:${(Math.random()-.5)*H*.3}px;--fall:${H*1.1}px;--r:${Math.random()*900-450}deg;`+
        `--c:${cols[k%cols.length]};animation-duration:${1.6+Math.random()*1.4}s;animation-delay:${Math.random()*.5}s`;
    }
    fx.appendChild(s); setTimeout(()=>s.remove(),3200);
  }
}
// petite fanfare façon Wii (do mi sol do + étincelle)
function winSnd(){ [523,659,784,1047].forEach((f,k)=>setTimeout(()=>blip(f,k<3?.13:.45,.06,"triangle"),k*120)); setTimeout(()=>blip(1568,.25,.03),560); }
// arrivée sur une étape : étincelles, et victoire sur la dernière
function methodArrive(m,i){
  const q=STEPS[i]; methodBurst(m,q[2]/16,q[3]/9,10,"m-spark");
  if(i!==STEPS.length-1) return blip(1250,.05,.035);
  m.classList.remove("win"); void m.offsetWidth; m.classList.add("win");
  methodBurst(m,0,0,46,"m-conf"); winSnd();
}
// le Mii roule jusqu'à l'étape i en suivant la route (courbe douce), puis le détail s'affiche
function methodShow(m,i,move=true){
  const p=m.querySelector(".m-path"), mii=m.querySelector(".m-mii"), box=m.querySelector(".m-info"), done=m.querySelector(".m-done");
  const L=p.getTotalLength(), b=lengthAt(p,STEPS[i][2],STEPS[i][3]);
  m.querySelectorAll(".m-step").forEach((x,k)=>{ x.classList.toggle("on",k===i); x.classList.toggle("done",k<i); });
  box.querySelector("h4").textContent=`Étape ${i+1} · ${STEPS[i][0]}`; if(move) methodText(i);
  box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop"); m.classList.add("info-on");
  if(i!==STEPS.length-1) m.classList.remove("win");
  cancelAnimationFrame(m._raf); m._at=i;
  const place=len=>{ const q=p.getPointAtLength(len); mii.style.setProperty("--mx",q.x/16); mii.style.setProperty("--my",q.y/9); done.style.strokeDashoffset=1-len/L; m._len=len; };
  if(!move||calm.matches){ place(b); if(move) methodArrive(m,i); return; }
  const a=m._len||0, dur=Math.min(1500,500+Math.abs(b-a)*.75), t0=performance.now();
  mii.classList.add("rolling"); mii.classList.toggle("back",b<a); m.classList.add("moving");
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur), e=-(Math.cos(Math.PI*k)-1)/2; // démarre et freine en douceur
    place(a+(b-a)*e);
    if(k<1){ m._raf=requestAnimationFrame(step); return; }
    mii.classList.remove("rolling"); m.classList.remove("moving"); methodArrive(m,i);
  };
  m._raf=requestAnimationFrame(step);
}
// À propos : la photo ronde s'incline en 3D vers la souris (18° max), reflet et ombre suivent
document.getElementById("ch-stage").addEventListener("pointermove",e=>{
  const pp=e.currentTarget.querySelector(".b-about .ab-pp"); if(!pp||calm.matches) return;
  const r=pp.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  // distance à la pastille rapportée à la taille de la bannière, bornée à ±1
  const box=e.currentTarget.getBoundingClientRect();
  const dx=Math.max(-1,Math.min(1,(e.clientX-cx)/(box.width*.35))), dy=Math.max(-1,Math.min(1,(e.clientY-cy)/(box.height*.45)));
  pp.classList.add("tilting");
  pp.style.setProperty("--pry",`${(dx*18).toFixed(1)}deg`);
  pp.style.setProperty("--prx",`${(-dy*18).toFixed(1)}deg`);
  pp.style.setProperty("--gx",`${50+dx*35}%`); pp.style.setProperty("--gy",`${50+dy*35}%`);
  pp.style.boxShadow=`0 0 0 4px #fff,0 0 0 8px var(--wii),${(-dx*18).toFixed(0)}px ${(12-dy*14).toFixed(0)}px 30px rgba(0,0,0,.5)`;
},{passive:true});
document.getElementById("ch-stage").addEventListener("pointerleave",e=>{
  const pp=e.currentTarget.querySelector(".b-about .ab-pp"); if(!pp) return;
  pp.classList.remove("tilting"); ["--prx","--pry"].forEach(k=>pp.style.removeProperty(k)); pp.style.boxShadow="";
});
document.getElementById("ch-stage").addEventListener("click",e=>{ // (stage n'est défini que plus bas)

/* Une vidéo par cadre, dans l'ordre de la liste VIDEOS (12 par page).
   À propos, Tarifs et Contact restent accessibles par le dock ;
   les anciennes chaînes (long, short, motion…) sont gardées dans CH pour pouvoir les remettre. */
const ytId = u => (u.match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([\w-]{11})/)||[])[1] || u.trim();
let nVid=0;
const addVideo = v => {
  if(v.fichier){ // vidéo hébergée sur le site : l'image à 1 s sert de miniature, la vidéo elle-même sert d'aperçu
    const key="v"+(nVid++), src=encodeURI(v.fichier);
    ART[key]=`<div class="banner b-video b-local"><video class="lv" src="${src}#t=1" muted playsinline loop preload="metadata" aria-hidden="true"></video></div>`;
    CH[key]={ t:v.titre||"Vidéo", s:v.sous||"Motion design", local:src, ch:CHAINES[v.chaine],
      text:v.texte||"", side:`<h3>${v.rubrique||"Motion design"}</h3>`+chips(v.tags||["After Effects","Animation","Habillage"]) };
    return key;
  }
  const id=ytId(v.url), short=v.short ?? /\/shorts\//.test(v.url), key="v"+(nVid++);
  ART[key]=short
    // Short : bandeau vertical centré sur fond flouté, avec la miniature verticale HD (oardefault, 1080×1920)
    ? `<div class="banner b-video is-short" style="--thumb:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg);--vthumb:url(https://i.ytimg.com/vi/${id}/oardefault.jpg)"><i class="bg"></i><i class="th"></i></div>`
    : `<div class="banner b-video" style="--thumb:url(https://i.ytimg.com/vi/${id}/maxresdefault.jpg)"><i class="bg"></i></div>`; // miniature HD 1280×720
  CH[key]={ t:v.titre||(short?"Vidéo courte":"Vidéo"), s:v.sous||(short?"Short · format vertical":"Vidéo YouTube"), yt:id, short, href:v.url, ch:CHAINES[v.chaine],
    text:v.texte||"", side:`<h3>${short?"Short":"Montage"}</h3>`+chips(v.tags||(short?["9:16","Hook","Sous-titres"]:["Montage","Sound design","Habillage"])) };
  return key;
};

/* ---------- Construction des pages (un thème = une page de 4 × 3) ---------- */
const PER=12, PAGE_STEP=93.56;               // largeur d'une page + écart entre thèmes, en u (4 × 20.29 + 3 × 0.8 + 10)
const PAGES=[];
THEMES.forEach((th,t)=>{
  const keys=th.videos.map(addVideo);
  keys.forEach(k=>CH[k].offre=th.titre);
  for(let i=0;i<Math.max(1,keys.length);i+=PER) PAGES.push({theme:t, keys:keys.slice(i,i+PER), total:keys.length});
});

      if(CH[id].yt||CH[id].local){ // carte titre qui alterne avec la miniature

        const info=document.createElement("span"); info.className="tile-info";

/* ---------- Changement de page (flèches, points, clavier, molette) ---------- */
const pgPrev=document.getElementById("pg-prev"), pgNext=document.getElementById("pg-next");
const desktop=matchMedia("(min-width:761px)");
const calm=matchMedia("(prefers-reduced-motion: reduce)");
let page=0;
function showPage(n,snd=true){
  n=Math.max(0,Math.min(nPages-1,n));
  const dir=Math.sign(n-page);
  if(n!==page && snd) blip(1180,.06,.05,"triangle");
  page=n;
  if(dir) grid.style.setProperty("--td",dir); // le titre arrive du côté d'où vient la page
  grid.style.transform=`translateX(calc(${-n * PAGE_STEP} * var(--u)))`;
  // seule la page affichée est cliquable
  pageEls.forEach((el,i)=>{ el.inert = desktop.matches && i!==n; el.classList.toggle("current",i===n); });
  pgPrev.hidden = n===0;
  pgNext.hidden = n>=nPages-1;
  setTheme(PAGES[n].theme);
  if(dir){ cascade(pageEls[n],dir); impact(); }
  // aperçus du thème affiché (lancés après le script : au tout premier appel, tout n'est pas encore défini)
  if(desktop.matches) queueMicrotask(()=>{ if(!current) ambientOn(pageEls[n]); });
}
// « impact » quand la page arrive : onde de couleur légère et son sourd
const impactEl=document.getElementById("impact");
let impactTimer=0;
function impact(){
  if(!desktop.matches||calm.matches) return;
  clearTimeout(impactTimer);
  impactTimer=setTimeout(()=>{
    impactEl.animate([{transform:"scale(.5)",opacity:.45},{transform:"scale(1.15)",opacity:0}],{duration:900,easing:"cubic-bezier(.22,1,.36,1)"});
    blip(150,.14,.05,"sine");
  },380); // quand la page arrive presque à sa place
}
// arrivée en cascade : chaque colonne glisse un peu après la précédente, dans le sens du slide
function cascade(pg,dir,delay=90){
  if(!desktop.matches||calm.matches) return;
  const u=Math.min(innerWidth,innerHeight*1.7778)/100;
  pg.querySelectorAll(".tile").forEach((t,i)=>{
    const col=i%4, c=dir>0?col:3-col;
    t.animate([{transform:`translateX(${dir*2*u}px)`,opacity:.55},{transform:"none",opacity:1}],
      {duration:750,delay:delay+c*35,easing:"cubic-bezier(.22,1,.36,1)",fill:"backwards"});
  });
}
pgPrev.onclick=()=>showPage(page-1);
pgNext.onclick=()=>showPage(page+1);
desktop.addEventListener("change",()=>showPage(page,false));
showPage(0,false);
document.addEventListener("keydown",e=>{
  if(current||document.getElementById("warning")) return;
  if(e.target.closest&&e.target.closest("input,textarea")) return; // on tape dans l'assistant
  if(e.key==="ArrowRight") showPage(page+1);
  if(e.key==="ArrowLeft")  showPage(page-1);
});
// molette / trackpad : un cran = un thème (avec un petit verrou pour ne pas tout sauter d'un coup)
let wheelAcc=0, wheelLock=0;
addEventListener("wheel",e=>{
  if(!desktop.matches||current||document.getElementById("warning")) return;
  if(e.target.closest&&e.target.closest(".chat,.profile")) return; // défilement dans une fenêtre
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  const now=performance.now();
  if(now<wheelLock){ wheelAcc=0; return; }
  wheelAcc+=d;
  if(Math.abs(wheelAcc)>45){ showPage(page+Math.sign(wheelAcc)); wheelAcc=0; wheelLock=now+650; }
},{passive:true});
// mobile : les thèmes sont empilés, l'ambiance suit celui qui est au milieu de l'écran
const midObs=new IntersectionObserver(es=>{
  if(desktop.matches) return;
  es.forEach(e=>{ if(e.isIntersecting){ setTheme(PAGES[pageEls.indexOf(e.target)].theme); if(!current) ambientOn(e.target); } });
},{rootMargin:"-45% 0px -45% 0px"});
pageEls.forEach(el=>midObs.observe(el));

/* Toutes les animations en boucle sont calées sur la même horloge :
   la bannière garde exactement la même position entre la tuile, le zoom et l'écran de chaîne. */
function sync(root){
  root.getAnimations({subtree:true}).forEach(a=>{
    if(a.effect && a.effect.getTiming().iterations===Infinity && a.playState!=="paused") a.startTime=0;
  });
}
sync(grid);

/* ---------- Sons (Web Audio, très discrets) ---------- */
let ctx=null, soundOn=true;
function blip(freq=1320,dur=.05,vol=.05,type="sine"){
  if(!soundOn) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state!=="running") ctx.resume(); // créé avant un clic, le moteur audio reste en pause sinon
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,ctx.currentTime);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}
const hoverSnd=()=>blip(1500,.04,.035);
const openSnd =()=>{blip(660,.09,.06,"triangle");setTimeout(()=>blip(990,.12,.05,"triangle"),70)};
const backSnd =()=>{blip(880,.08,.05,"triangle");setTimeout(()=>blip(590,.1,.04,"triangle"),60)};
const clickSnd=()=>blip(1180,.06,.05,"triangle");
// relance le moteur audio à chaque clic, et petit « clic » sur les boutons de l assistant
addEventListener("pointerdown",()=>{ if(ctx&&ctx.state!=="running") ctx.resume(); },true);
document.addEventListener("click",e=>{ if(e.target.closest(".chat-chips button,.msg-acts button")) clickSnd(); },true); // capture : avant que le bouton soit remplacé

document.addEventListener("pointerover",e=>{
  const t=e.target.closest("button.tile,.orb,.pill,.sd,.pg,.dot,.chat-chips button,.msg-acts button,.m-step");
  if(t && !t.contains(e.relatedTarget)) hoverSnd();
});
document.addEventListener("focusin",e=>{ if(e.target.matches("button.tile,.orb,.pill")) hoverSnd(); });

/* ---------- Musique du menu ---------- */
// var (et non const/let) : la musique est demandée dès la construction des thèmes, plus haut dans le script
var bgm=document.getElementById("bgm");   // piste en cours (change avec le thème)
const sfxStart=document.getElementById("sfx-start");
var VOL=.35;              // volume de l'OST (0 à 1)
var musicOn=false, musicPausedForVideo=false;
sfxStart.volume=.6;

// Message visible si un fichier audio ne se charge pas (dossier audio manquant, etc.)
function audioError(name){
  if(document.getElementById("audio-err")) return;
  const d=document.createElement("div");
  d.id="audio-err";
  d.style.cssText="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;background:#fff;border:3px solid #e5484d;color:#b42318;border-radius:14px;padding:10px 16px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.15);max-width:92vw;text-align:center";
  d.textContent=`Son introuvable (${name}). Vérifie que le dossier "audio" est bien à côté de index.html.`;
  document.body.appendChild(d);
}
bgm.addEventListener("error",()=>audioError("audio/menu.mp3"));
sfxStart.addEventListener("error",()=>audioError("audio/start.mp3"));

/* Volume des musiques piloté par le moteur audio du navigateur (Web Audio) :
   les courbes sont calculées à l'échantillon près, sans paliers ni à-coups. */
function audioCtx(){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} return ctx; }
const FROM_FILE=location.protocol==="file:"; // page ouverte en double-cliquant sur le fichier (pas sur un vrai site)
function wire(el){ // branche une piste sur un gain réglable (une seule fois)
  // en file:// le navigateur rend la musique muette si elle passe par le moteur audio : on garde le volume classique
  if(el._gain||FROM_FILE||!audioCtx()) return el._gain;
  try{
    const g=ctx.createGain(); g.gain.value=el.volume; el.volume=1;
    ctx.createMediaElementSource(el).connect(g).connect(ctx.destination);
    el._gain=g;
  }catch(e){}
  return el._gain;
}
function setVol(el,v){
  if(el._gain){ const g=el._gain.gain; g.cancelScheduledValues(0); g.value=v; } else el.volume=v;
}
// fondu de volume sur une piste (chaque piste a son propre fondu, pour pouvoir les croiser)
// shape "in"/"out" = courbes à puissance constante (sinus / cosinus) : volume perçu stable pendant un fondu croisé
function fadeEl(el,target,ms=600,done,shape){
  clearTimeout(el._done); clearInterval(el._fade);
  const g=el._gain&&el._gain.gain;
  if(g){
    const from=g.value, N=96, curve=new Float32Array(N);
    for(let i=0;i<N;i++){
      const k=i/(N-1), e=shape==="in"?Math.sin(k*Math.PI/2):shape==="out"?1-Math.cos(k*Math.PI/2):k*k*(3-2*k);
      curve[i]=from+(target-from)*e;
    }
    g.cancelScheduledValues(0); g.value=from;           // reprend exactement là où en était le fondu précédent
    g.setValueCurveAtTime(curve,ctx.currentTime+.01,ms/1000);
    el._done=setTimeout(()=>done&&done(),ms+40);
    return;
  }
  const start=el.volume, steps=Math.max(1,Math.round(ms/30)); let i=0;
  el._fade=setInterval(()=>{
    i++; const k=i/steps, e=k*k*(3-2*k); // courbe douce (lent → rapide → lent)
    el.volume=Math.min(1,Math.max(0,start+(target-start)*e));
    if(i>=steps){ clearInterval(el._fade); done&&done(); }
  },30);
}
function fadeTo(target,ms=600,done){ fadeEl(bgm,target,ms,done); }

/* Une musique par thème (champ musique de THEMES, sinon audio/menu.mp3).
   Au changement de thème : fondu croisé, l'ancienne baisse pendant que la nouvelle monte. */
const TRACKS={"audio/menu.mp3":bgm};
const MSG_OST="audio/message.mp3"; // « 1 nouveau message » (bouton en bas à droite) : Yoga de Wii Fit
const allTracks=()=>[...THEMES.map(th=>th.musique||"audio/menu.mp3"),MSG_OST];
const themeOst=()=>THEMES[Math.max(0,shownTheme)].musique||"audio/menu.mp3";
function track(src){
  if(!TRACKS[src]){
    const a=new Audio(src); a.loop=true; a.preload="auto"; a.volume=0;
    a.addEventListener("error",()=>audioError(src));
    TRACKS[src]=a;
  }
  return TRACKS[src];
}
function switchMusic(src,ms=2400){
  const next=track(src); if(next===bgm) return;
  const prev=bgm; bgm=next;
  if(!musicOn||!soundOn||musicPausedForVideo){ prev.pause(); return; } // la bonne piste partira à la reprise
  // fondu croisé à puissance constante, 2,4 s
  fadeEl(prev,0,ms,()=>{ if(prev!==bgm) prev.pause(); },"out");
  next.muted=false;
  if(next.paused){ setVol(next,0); next.currentTime=0; next.play().catch(()=>{}); }
  fadeEl(next,VOL,ms,null,"in");
}

/* Les navigateurs (surtout Safari / iPhone) n'autorisent la lecture
   que PENDANT un clic. On lance donc l'OST tout de suite au clic, en muet,
   puis on la rend audible quand le son de démarrage est fini. */
function unlockMusic(){
  if(musicOn||!soundOn) return;
  musicOn=true;
  // moteur audio démarré pendant le clic, et toutes les pistes des thèmes branchées dessus
  if(audioCtx()){ ctx.resume&&ctx.resume(); allTracks().forEach(s=>wire(track(s))); wire(bgm); }
  bgm.muted=true; setVol(bgm,0);
  const p=bgm.play();
  if(p) p.catch(err=>{ musicOn=false; console.warn("OST bloquée :",err); });
  // les autres pistes des thèmes sont « débloquées » pendant ce même clic, pour pouvoir les lancer plus tard
  allTracks().forEach(s=>{
    const a=track(s);
    if(a!==bgm){ a.muted=true; a.play().then(()=>{ if(a!==bgm){ a.pause(); a.muted=false; } }).catch(()=>{}); }
  });
}
let revealed=false;
function revealMusic(){
  if(!musicOn||!soundOn||revealed) return;
  revealed=true;
  bgm.currentTime=0;
  bgm.muted=false;
  fadeTo(VOL,1500);
}

// Son bloqué à l'arrivée (le navigateur attend un clic) : au premier clic/touche, le son d'allumage
// puis l'OST qui monte à la fin du jingle
let startPlayed=false;
function firstGesture(){
  if(!startPlayed&&soundOn){
    startPlayed=true; unlockMusic();
    sfxStart.currentTime=0;
    sfxStart.onended=revealMusic;
    sfxStart.play().catch(revealMusic);
    setTimeout(revealMusic,3600); // sécurité
  } else { unlockMusic(); revealMusic(); }
  if(musicOn){ removeEventListener("pointerdown",firstGesture); removeEventListener("keydown",firstGesture); }
}
addEventListener("pointerdown",firstGesture);
addEventListener("keydown",firstGesture);

const sndBtn=document.getElementById("snd");
sndBtn.onclick=()=>{
  soundOn=!soundOn;
  if(soundOn){
    bgm.muted=false;
    if(!musicOn){ unlockMusic(); revealMusic(); }
    else if(!musicPausedForVideo){ bgm.play().catch(()=>{}); fadeTo(VOL); }
  } else {
    fadeTo(0,300,()=>{ if(!soundOn) bgm.pause(); });
  }
  sndBtn.setAttribute("aria-pressed",soundOn);
  sndBtn.setAttribute("aria-label",soundOn?"Couper les sons":"Activer les sons");
  document.getElementById("snd-wave").style.opacity=soundOn?1:.15;
};

/* ---------- Arrivée : allumage de la console ---------- */
// le jingle start.mp3 part avec la ligne du tube ; si le navigateur bloque le son, il partira au premier clic (firstGesture)
setTimeout(()=>document.getElementById("boot").remove(),2400); // l'écran d'allumage a fini son travail
setTimeout(()=>cascade(pageEls[page],1,150),calm.matches?0:1150); // le menu arrive quand le noir se lève
setTimeout(()=>{
  if(!soundOn) return;
  sfxStart.currentTime=0;
  sfxStart.play().then(()=>{
    startPlayed=true;
    sfxStart.onended=()=>{ unlockMusic(); revealMusic(); };
  }).catch(()=>{}); // bloqué : on attend le premier clic
},calm.matches?0:350);

/* ---------- Ouverture d'une chaîne ---------- */
const chEl=document.getElementById("channel");
const stage=document.getElementById("ch-stage");
const ambi=document.getElementById("ambi");
const btnGo=document.getElementById("btn-go");
const btnMenu=document.getElementById("btn-menu");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let current=null, lastTrigger=null;

const chBar=document.querySelector(".ch-bar");
const chWrap=document.querySelector(".ch-wrap");
let zoomTile=null, busy=false;
const OUT="cubic-bezier(.22,1,.36,1)", INOUT="cubic-bezier(.65,0,.35,1)";

// trou dans l'effet cathodique : sur le lecteur quand une vidéo joue, sur la grille des cadres dans le menu
const crtEl=document.getElementById("crt");
function crtHole(on=true){
  if(!crtEl) return;
  const c=CH[current];
  let box=null;
  if(on&&c&&(c.yt||c.local)) box=stage;                                   // vidéo en lecture
  else if(!current&&desktop.matches) box=document.querySelector(".pages-view"); // menu : zone des cadres
  if(!box){ crtEl.classList.remove("hole"); return; }
  const r=box.getBoundingClientRect();
  crtEl.style.setProperty("--hx",r.left+"px"); crtEl.style.setProperty("--hy",r.top+"px");
  crtEl.style.setProperty("--hw",r.width+"px"); crtEl.style.setProperty("--hh",r.height+"px");
  crtEl.classList.add("hole");
}
document.getElementById("channel").addEventListener("scroll",()=>{ if(current) crtHole(); },{passive:true});
addEventListener("resize",()=>crtHole());
queueMicrotask(()=>crtHole()); // menu affiché au chargement

function fillChannel(id){
  const c=CH[id];
  current=id;
  switchMusic(id==="contact"?MSG_OST:themeOst()); // fondu croisé vers la musique du message, ou retour à celle du thème
  chEl.classList.toggle("is-about",id==="about"); // le texte est déjà dans la bannière
  ambiStop();
  stage.innerHTML=ART[id]; sync(stage);
  methodInit(stage);
  // ambilight : la miniature de la vidéo (sinon un halo de la couleur du thème)
  const v=stage.querySelector(".b-video");
  if(v) ambi.style.setProperty("--thumb",v.style.getPropertyValue("--thumb")); else ambi.style.removeProperty("--thumb");
  ambi.classList.toggle("is-short",!!stage.querySelector(".is-short"));
  document.getElementById("ch-title").textContent=c.t;
  const au=document.getElementById("ch-author");
  if(c.ch){ au.href=c.ch.url; au.querySelector("img").src=c.ch.pp; au.querySelector("span").textContent=c.ch.nom; au.hidden=false; }
  else au.hidden=true;
  const sub=document.getElementById("ch-sub"); sub.textContent=c.s; sub.hidden=false;
  document.getElementById("ch-text").innerHTML=`<p>${c.text}</p>`;
  const side=document.getElementById("ch-side"); side.innerHTML=c.side;
  avisInit(side);
  if(c.yt){ // YouTube reste accessible, mais en lien secondaire (le bouton principal mène au contact)
    const a=document.createElement("a"); a.className="chip yt-link"; a.href=c.href||`https://youtu.be/${c.yt}`;
    a.target="_blank"; a.rel="noopener"; a.textContent="Voir sur YouTube ↗"; side.appendChild(a);
  }
  btnGo.classList.toggle("cta",!!c.mail); // « Écrire » mis en avant : c’est l’action à faire ici
  btnGo.textContent = c.mail ? "Écrire" : c.go ? "Me contacter" : (c.yt||c.local) ? "Je veux ce montage" : "Lancer";
  if(stage.querySelector(".b-method")) methodText(0,false); // titre + description de l'étape 1 sous le cadre
  fitMethod();
}

// Copie de la bannière à la taille de l'écran de chaîne, déplacée en transform (GPU)
function makeGhost(id,s){
  const g=document.createElement("div");
  g.className="ch-stage big zoom-ghost";
  g.innerHTML=ART[id];
  Object.assign(g.style,{left:s.left+"px",top:s.top+"px",width:s.width+"px",height:s.height+"px"});
  document.body.appendChild(g);
  sync(g);
  return g;
}
const toRect=(s,t)=>`translate(${t.left-s.left}px,${t.top-s.top}px) scale(${t.width/s.width},${t.height/s.height})`;
// Aspect de la tuile, compensé par l'échelle du fantôme : coins et bord identiques au départ du zoom
function tileLook(tile,s,t){
  const cs=getComputedStyle(tile), r=parseFloat(cs.borderTopLeftRadius);
  return {transform:toRect(s,t),borderRadius:`${r*s.width/t.width}px / ${r*s.height/t.height}px`,borderColor:cs.borderTopColor};
}
const stageLook={transform:"none",borderRadius:"26px / 26px",borderColor:"#fff"};
const clearAnims=()=>{ [chEl,chBar,chWrap].forEach(el=>el.getAnimations().forEach(a=>a.cancel())); };

function openChannel(id,trigger){
  if(!CH[id]||busy) return;
  pvStop();
  if(id==="contact") markMailRead();
  const fromInside=!!current;
  const isTile=!!(trigger && trigger.classList.contains("tile"));
  if(!fromInside){ lastTrigger=trigger||lastTrigger; zoomTile=isTile?trigger:null; }
  else zoomTile=null; // navigation interne : retour au menu en fondu
  openSnd();

  // Changement de chaîne depuis une chaîne : fondu du contenu
  if(fromInside){
    if(reduce){ fillChannel(id); playVideo(); ambi.classList.add("on"); return; }
    busy=true;
    chWrap.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(-6px)"}],{duration:140,easing:"ease-in",fill:"forwards"}).onfinish=()=>{
      fillChannel(id); chEl.scrollTop=0; playVideo(); crtHole();
      chWrap.getAnimations().forEach(a=>a.cancel());
      chWrap.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],{duration:260,easing:OUT}).onfinish=()=>busy=false;
    };
    return;
  }

  fillChannel(id);
  crtHole(false); // l'écran de chaîne garde l'effet partout (le trou du lecteur arrive avec la vidéo)
  chEl.classList.add("open"); chEl.scrollTop=0;
  fitMethod(); // la chaîne est visible : on peut mesurer la place
  document.body.style.overflow="hidden";
  if(reduce){ document.body.classList.add("ch-open"); btnMenu.focus(); playVideo(); ambi.classList.add("on"); crtHole(); return; }
  busy=true;
  // la vidéo démarre une fois le zoom fini (pas de chargement du lecteur pendant l'animation), l'ambilight s'allume en fondu
  // le lecteur (lourd à créer) n'arrive qu'une fois toutes les animations d'ouverture finies : pas d'à-coup pendant le zoom
  const done=()=>{ busy=false; document.body.classList.add("ch-open"); btnMenu.focus({preventScroll:true});
    setTimeout(()=>{ if(current===id){ playVideo(); ambi.classList.add("on"); crtHole(); } },160); };

  if(isTile){
    const s=stage.getBoundingClientRect(), t=trigger.getBoundingClientRect();
    const g=makeGhost(id,s);
    stage.style.visibility="hidden"; trigger.style.visibility="hidden";
    chEl.animate([{opacity:0},{opacity:1}],{duration:300,easing:"ease-out"});
    chWrap.querySelector(".ch-info").animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:380,delay:160,easing:OUT,fill:"backwards"});
    chBar.animate([{opacity:0,transform:"translateY(40px)"},{opacity:1,transform:"none"}],{duration:420,delay:120,easing:OUT,fill:"backwards"});
    g.animate([tileLook(trigger,s,t),stageLook],{duration:460,easing:OUT}).onfinish=()=>{
      stage.style.visibility=""; trigger.style.visibility="";
      g.remove(); done();
    };
  } else {
    chEl.animate([{opacity:0},{opacity:1}],{duration:260,easing:"ease-out"});
    chWrap.animate([{opacity:0,transform:"scale(.96)"},{opacity:1,transform:"none"}],{duration:360,easing:OUT});
    chBar.animate([{opacity:0,transform:"translateY(40px)"},{opacity:1,transform:"none"}],{duration:380,easing:OUT}).onfinish=done;
  }
}

function closeChannel(){
  if(!current||busy) return;
  backSnd();
  switchMusic(themeOst(),900); // retour au menu : la musique du thème revient tout de suite, fondu court
  ambi.classList.remove("on");
  ambiStop(true); // on met juste en pause : détruire le lecteur maintenant ferait saccader le zoom retour
  crtHole(false);
  document.body.classList.remove("ch-open");
  sync(grid); // les bannières du menu reprennent en phase avec l'horloge commune
  const id=current;
  const finish=()=>{
    chEl.classList.remove("open"); stage.style.visibility=""; current=null; busy=false;
    setTimeout(()=>{ if(!current) stage.innerHTML=""; },60); // le lecteur est retiré une fois l'écran revenu au menu
    clearAnims();
    ambientResumeNow(); // les aperçus du menu reprennent
    crtHole();          // le trou revient sur la grille des cadres
    if(musicOn && soundOn && musicPausedForVideo){ musicPausedForVideo=false; bgm.play().catch(()=>{}); fadeTo(VOL,900); }
    document.body.style.overflow="";
    if(lastTrigger) lastTrigger.focus({preventScroll:true});
  };
  if(reduce) return finish();
  busy=true;

  if(zoomTile){
    const s=stage.getBoundingClientRect(), t=zoomTile.getBoundingClientRect();
    const g=makeGhost(id,s), tile=zoomTile;
    stage.style.visibility="hidden"; tile.style.visibility="hidden";
    chEl.animate([{opacity:1},{opacity:0}],{duration:300,easing:"ease-in",fill:"forwards"});
    chBar.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(40px)"}],{duration:260,easing:"ease-in",fill:"forwards"});
    g.animate([stageLook,tileLook(tile,s,t)],{duration:380,easing:INOUT}).onfinish=()=>{ finish(); tile.style.visibility=""; g.remove(); };
  } else {
    chBar.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(40px)"}],{duration:220,easing:"ease-in",fill:"forwards"});
    chEl.animate([{opacity:1},{opacity:0}],{duration:240,easing:"ease-in",fill:"forwards"}).onfinish=finish;
  }
}

// Lecteur YouTube dans l'écran de chaîne : la miniature reste dessous le temps que le lecteur charge
function playVideo(){
  const c=CH[current];
  if(c&&c.local&&!stage.querySelector("video.player")){ playLocal(c); return; }
  if(!c||!c.yt||stage.querySelector("iframe")) return;
  if(musicOn && !musicPausedForVideo){ musicPausedForVideo=true; fadeTo(0,400,()=>bgm.pause()); } // silence pendant la vidéo
  const f=document.createElement("iframe");
  f.id="yt-frame";
  f.src=`https://www.youtube-nocookie.com/embed/${c.yt}?autoplay=1&rel=0&playsinline=1&modestbranding=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
  f.title=c.t; f.allow="autoplay; fullscreen; picture-in-picture; encrypted-media"; f.allowFullscreen=true;
  f.style.animation="fadein .5s ease both";
  stage.appendChild(f);
  ambiLive(c.yt,f);
}

// Vidéo hébergée sur le site : lecteur HTML5, et l'ambilight lit directement ses images (vraiment en direct)
let ambiCanvasTimer=0;
function playLocal(c){
  if(musicOn && !musicPausedForVideo){ musicPausedForVideo=true; fadeTo(0,400,()=>bgm.pause()); }
  const v=document.createElement("video");
  v.className="player"; v.src=c.local; v.controls=true; v.autoplay=true; v.playsInline=true; v.loop=true;
  v.style.animation="fadein .4s ease both";
  stage.appendChild(v);
  v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); }); // si le son est refusé, on lance en muet
  ambiStop();
  const cv=document.createElement("canvas"); cv.width=48; cv.height=27; cv.className="ambi-cv";
  ambi.appendChild(cv);
  const cx=cv.getContext("2d");
  // ~12 images/s suffisent : le rendu est très flouté, et le flou est recalculé à chaque image
  ambiCanvasTimer=setInterval(()=>{ if(v.readyState>=2) cx.drawImage(v,0,0,48,27); },80);
}

/* ---------- Ambilight en direct ----------
   YouTube interdit de lire les images du lecteur. On utilise donc ses « storyboards »
   (planches d'images clés, téléchargées dans ambi/<id>/ avec le script storyboards.js),
   et l'API YouTube donne le temps de lecture : on affiche l'image clé du moment,
   en fondu continu vers la suivante. Sans planche, la miniature floutée reste affichée. */
const AMBI={ // n images, grille cols × rows par planche, une image toutes les ms, ar = format d'une image
  EyvKJxkV07Q:{n:134,cols:10,rows:10,ms:5000,ar:"16/9"},
  i3mpnOCxzvI:{n:41,cols:3,rows:3,ms:1000,ar:"101/180"},
  Z9rUfSrhWmU:{n:101,cols:10,rows:10,ms:5000,ar:"16/9"},
  vtBjPI1wK0A:{n:33,cols:3,rows:3,ms:1000,ar:"101/180"},
  G4Lrtq9WyKg:{n:119,cols:10,rows:10,ms:5000,ar:"16/9"},
  cPyOC4TUdF8:{n:82,cols:3,rows:3,ms:1000,ar:"101/180"},
};
const ambiLayers=[...ambi.querySelectorAll("i")];
let ambiRaf=0, ytPlayer=null, ytApi=null;
function loadYtApi(){
  if(!ytApi) ytApi=new Promise(res=>{
    if(window.YT&&YT.Player) return res();
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{ prev&&prev(); res(); };
    const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  });
  return ytApi;
}
// place l'image clé k de la vidéo dans un calque (sans rien toucher si c'est déjà la bonne)
function ambiShow(id,sb,k,layer){
  k=Math.max(0,Math.min(sb.n-1,k));
  const per=sb.cols*sb.rows, s=Math.floor(k/per), j=k%per;
  const p=sb.p||"M";
  if(layer.dataset.k===id+p+k) return;
  layer.dataset.k=id+p+k;
  const rows=Math.ceil(Math.min(per,sb.n-s*per)/sb.cols); // la dernière planche n'a que les rangées utiles
  const c=j%sb.cols, r=Math.floor(j/sb.cols);
  layer.style.backgroundImage=`url(ambi/${id}/${p}${s}.webp)`;
  layer.style.backgroundSize=`${sb.cols*100}% ${rows*100}%`;
  layer.style.backgroundPosition=`${sb.cols>1?c/(sb.cols-1)*100:0}% ${rows>1?r/(rows-1)*100:0}%`;
}
function ambiStop(soft){
  cancelAnimationFrame(ambiRaf); ambiRaf=0;
  clearInterval(ambiCanvasTimer); ambiCanvasTimer=0;
  ambi.querySelectorAll(".ambi-cv").forEach(c=>c.remove());
  if(soft){ // pause seulement (léger), le lecteur sera retiré plus tard
    try{ ytPlayer&&ytPlayer.pauseVideo&&ytPlayer.pauseVideo(); }catch(e){}
    const v=stage.querySelector("video.player"); v&&v.pause();
  } else { try{ ytPlayer&&ytPlayer.destroy&&ytPlayer.destroy(); }catch(e){} }
  ytPlayer=null;
  ambiLayers.forEach(l=>{ l.style.opacity=0; delete l.dataset.k; });
}
function ambiLive(id,frame){
  ambiStop();
  const sb=AMBI[id]; if(!sb) return;
  const sheets=Math.ceil(sb.n/(sb.cols*sb.rows));
  for(let s=0;s<sheets;s++) new Image().src=`ambi/${id}/M${s}.webp`; // préchargement : pas de trou au changement de planche
  ambiLayers.forEach(l=>l.style.setProperty("--ar",sb.ar));
  // temps de lecture : la valeur de l'API arrive par à-coups, on l'extrapole entre deux mises à jour
  let t=0, lastT=-1, stamp=performance.now(), playing=false;
  loadYtApi().then(()=>{
    if(stage.querySelector("#yt-frame")!==frame) return; // l'utilisateur est déjà reparti
    ytPlayer=new YT.Player(frame,{events:{onStateChange:e=>{ playing=e.data===1; stamp=performance.now(); }}});
  });
  const [a,b]=ambiLayers;
  let drawn=0;
  const loop=now=>{
    ambiRaf=requestAnimationFrame(loop);
    if(now-drawn<80) return; // ~12 mises à jour/s : le flou est recalculé à chaque changement, inutile de le faire 60 fois/s
    drawn=now;
    if(ytPlayer&&ytPlayer.getCurrentTime){
      const ct=ytPlayer.getCurrentTime()||0;
      if(ct!==lastT){ lastT=ct; t=ct; stamp=now; }
      else if(playing) t=lastT+(now-stamp)/1000;
    }
    const f=t*1000/sb.ms, k=Math.floor(f);
    ambiShow(id,sb,k,a); ambiShow(id,sb,k+1,b);
    a.style.opacity=1; b.style.opacity=(f-k).toFixed(2); // fondu continu vers l'image clé suivante
  };
  ambiRaf=requestAnimationFrame(loop);
}

/* ---------- Aperçus permanents, comme les chaînes animées de la Wii ----------
   Chaque cadre du thème affiché alterne toutes les 3 s entre sa miniature et une carte titre (comme les
   chaînes de la Wii), chacun décalé ; la vidéo du site joue en muet dessous.
   Les autres thèmes sont en pause, et tout s'arrête quand une vidéo est ouverte ou l'onglet caché. */
var ambientPage=null, ambientResume=null;
function tileStart(tile,delay){
  const c=CH[tile.dataset.open];
  if(!c||!(c.yt||c.local)||tile._amb) return;
  const st=tile._amb={timer:0,wait:0};
  const lv=c.local&&tile.querySelector("video.lv");
  // miniature et carte titre alternent toutes les 3 s, en fondu (la vidéo du site continue de jouer dessous)
  st.wait=setTimeout(()=>{
    if(tile._amb!==st) return;
    lv&&lv.play().catch(()=>{});
    tile.classList.add("t-title");
    st.timer=setInterval(()=>tile.classList.toggle("t-title"),3000);
  },delay);
}
function tileStop(tile){
  const st=tile._amb; if(!st) return;
  clearTimeout(st.wait); clearInterval(st.timer); tile._amb=null;
  tile.classList.remove("t-title");
  const lv=tile.querySelector("video.lv"); lv&&lv.pause();
}
function ambientOn(pg){
  if(!pg||calm.matches) return;
  if(ambientPage&&ambientPage!==pg) ambientOff();
  if(ambientPage===pg) return;
  ambientPage=pg;
  pg.querySelectorAll("button.tile").forEach((t,i)=>tileStart(t,1200+i*700)); // décalés : les cadres n'alternent pas tous ensemble
}
function ambientOff(){ if(!ambientPage) return; ambientPage.querySelectorAll("button.tile").forEach(tileStop); ambientPage=null; }
// ouverture d'une vidéo : on met en pause et on retient le thème pour reprendre au retour
function pvStop(){ if(ambientPage){ ambientResume=ambientPage; ambientOff(); } }
function ambientResumeNow(){ const pg=ambientResume; ambientResume=null; ambientOn(pg); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pvStop(); else if(!current) ambientResumeNow(); });
/* ---------- Couleur du contour au survol = couleur dominante (la plus vive) de l'image du cadre ---------- */
function vividColor(img){
  const S=24, cv=document.createElement("canvas"); cv.width=cv.height=S;
  const cx=cv.getContext("2d",{willReadFrequently:true});
  cx.drawImage(img,0,0,S,S);
  const d=cx.getImageData(0,0,S,S).data; // lève une erreur si l'image n'est pas lisible (CORS)
  let R=0,G=0,B=0,W=0;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    const sat=mx?(mx-mn)/mx:0, lum=(mx+mn)/510;
    const w=sat*sat*(1-Math.abs(lum-.5)*1.6)+.01;           // on favorise les pixels colorés et ni trop sombres ni trop clairs
    R+=r*w; G+=g*w; B+=b*w; W+=w;
  }
  // on pousse la couleur obtenue pour qu'elle claque sur le fond sombre
  let [h,s,l]=rgbToHsl(R/W,G/W,B/W);
  return `hsl(${Math.round(h)} ${Math.round(Math.max(s,.65)*100)}% ${Math.round(Math.min(.68,Math.max(.55,l))*100)}%)`;
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, dl=mx-mn;
  if(!dl) return [0,0,l];
  const s=dl/(1-Math.abs(2*l-1));
  const h=mx===r?60*(((g-b)/dl)%6):mx===g?60*((b-r)/dl+2):60*((r-g)/dl+4);
  return [(h+360)%360,s,l];
}
const loadImg=(src,cors)=>new Promise((res,rej)=>{ const im=new Image(); if(cors) im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=rej; im.src=src; });
document.querySelectorAll("button.tile").forEach(tile=>{
  const c=CH[tile.dataset.open];
  if(c&&c.local){ // vidéo du site : couleur tirée de l'image affichée en miniature
    const lv=tile.querySelector("video.lv");
    const take=()=>{ try{ tile.style.setProperty("--tc",vividColor(lv)); }catch(e){} };
    if(lv.readyState>=2) take(); else lv.addEventListener("loadeddata",take,{once:true});
    return;
  }
  if(!c||!c.yt) return;
  // miniature YouTube (si elle est lisible), sinon la 1re planche d'images clés hébergée sur le site
  loadImg(`https://i.ytimg.com/vi/${c.yt}/hqdefault.jpg`,true).then(vividColor)
    .catch(()=>loadImg(`ambi/${c.yt}/M0.webp`).then(vividColor))
    .then(col=>tile.style.setProperty("--tc",col))
    .catch(()=>{}); // pas d'image lisible : on garde la couleur du thème
});

// inclinaison 3D (6° max) et reflet qui suivent la souris sur le cadre survolé
grid.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"||calm.matches) return;
  const t=e.target.closest("button.tile"); if(!t) return;
  const r=t.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  t.style.setProperty("--ry",`${((x-.5)*6).toFixed(2)}deg`);   // 3° max : subtil
  t.style.setProperty("--rx",`${((.5-y)*6).toFixed(2)}deg`);
  t.style.setProperty("--mx",`${(x*100).toFixed(1)}%`);
  t.style.setProperty("--my",`${(y*100).toFixed(1)}%`);
},{passive:true});
grid.addEventListener("pointerout",e=>{
  const t=e.target.closest("button.tile");
  if(t&&!t.contains(e.relatedTarget)) ["--rx","--ry"].forEach(k=>t.style.removeProperty(k));
});

    big.onerror=()=>{ big.removeAttribute("src"); };
    art.appendChild(big);
    const sm=a.assets&&assetUrl(a,a.assets.small_image);
    if(sm&&!spot){ const im=new Image(); im.className="act-small"; im.alt=""; im.src=sm; art.appendChild(im); }
    txt.appendChild(el("span","act-kind",spot?"Écoute Spotify":`${ACT_KIND[a.type]||""} ${a.type===0?"":a.name}`.trim()));
    if(spot&&p.spotify){
      txt.appendChild(el("b",null,p.spotify.song));
      txt.appendChild(el("span",null,"de "+p.spotify.artist));
      const bar=el("div","act-bar"), fill=el("i"); bar.appendChild(fill); txt.appendChild(bar);
      const times=el("div","act-times"); times.append(el("span"),el("span")); txt.appendChild(times);
      fill.dataset.start=p.spotify.timestamps.start; fill.dataset.end=p.spotify.timestamps.end;
    } else {
      txt.appendChild(el("b",null,a.name));
      if(a.details) txt.appendChild(el("span",null,a.details));
      if(a.state) txt.appendChild(el("span",null,a.state));
      if(a.timestamps&&a.timestamps.start){ const t=el("span","act-time"); t.dataset.start=a.timestamps.start; txt.appendChild(t); }
    }
    row.append(art,txt); list.appendChild(row);
  });
  document.getElementById("pf-act").hidden=!acts.length;
  tickPresence();
  clearInterval(presTimer); presTimer=setInterval(tickPresence,1000);
}
// compteurs « écoulé » et barre Spotify, mis à jour chaque seconde
function tickPresence(){
  const now=Date.now();
  document.querySelectorAll("#pf-act .act-time").forEach(t=>t.textContent=fmtDur(now-t.dataset.start)+" écoulées");
  document.querySelectorAll("#pf-act .act-bar i").forEach(f=>{
    const st=+f.dataset.start, en=+f.dataset.end, dur=en-st, pos=Math.min(dur,now-st);
    f.style.transform=`scaleX(${Math.max(0,Math.min(1,pos/dur))})`;
    const [a,b]=f.parentNode.nextSibling.children; a.textContent=fmtDur(pos); b.textContent=fmtDur(dur);
  });
}
function connectLanyard(retry=1000){
  let ws, hb=0;
  try{ ws=new WebSocket("wss://api.lanyard.rest/socket"); }catch(e){ return; }
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.op===1){ // hello : on s'abonne à Fahim et on envoie le battement de cœur demandé
      ws.send(JSON.stringify({op:2,d:{subscribe_to_id:DISCORD_ID}}));
      hb=setInterval(()=>ws.readyState===1&&ws.send(JSON.stringify({op:3})),m.d.heartbeat_interval);
      retry=1000;
    } else if(m.op===0&&(m.t==="INIT_STATE"||m.t==="PRESENCE_UPDATE")&&m.d&&m.d.discord_status){
      renderPresence(m.d);
    }
  };
  // coupure : on se reconnecte, en espaçant les essais (sauf si l'utilisateur n'est pas suivi par Lanyard)
  ws.onclose=e=>{ clearInterval(hb); if(e.code!==4004&&retry<60000) setTimeout(()=>connectLanyard(retry*2),retry); };
}

const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ");
function bubble(cls,html,acts){
  const m=document.createElement("div"); m.className="msg "+cls;
  if(cls==="me") m.textContent=html; else m.innerHTML=html;   // ce que tape le visiteur reste du texte brut
  if(acts&&acts.length){
    const row=document.createElement("div"); row.className="msg-acts";
    acts.forEach(([label,fn])=>{ const b=document.createElement("button"); b.type="button"; b.textContent=label; b.onclick=fn; row.appendChild(b); });
    m.appendChild(row);
  }
  chatLog.appendChild(cls==="bot"?withAvatar(m):m); chatLog.scrollTop=chatLog.scrollHeight;
  return m;
}
// une réponse de l'assistant = sa photo + la bulle, comme dans une messagerie
function withAvatar(el){
  const row=document.createElement("div"); row.className="msg-row";
  const av=new Image(); av.className="msg-av"; av.src="images/assistant.png"; av.alt="";
  row.append(av,el); return row;
}
function botSay(html,acts){
  const t=document.createElement("div"); t.className="msg bot typing"; t.innerHTML="<i></i><i></i><i></i>";
  const tr=withAvatar(t); chatLog.appendChild(tr); chatLog.scrollTop=chatLog.scrollHeight;
  setTimeout(()=>{ tr.remove(); bubble("bot",html,acts); blip(990,.05,.035,"triangle"); },450+Math.random()*350);
}
function answer(q){
  const n=" "+norm(q)+" ";
  let best=null, score=0;
  // un mot-clé compte s'il apparaît en début de mot ; score = nombre de mots-clés trouvés,
  // départagé par leur longueur totale (le sujet le plus précis l'emporte)
  FAQ.forEach(f=>{
    const hits=f.keys.map(w=>norm(w).trim()).filter(w=>n.includes(" "+w));
    const s=hits.length+hits.join("").length/1000;
    if(hits.length&&s>score){ score=s; best=f; }
  });
  if(best) botSay(best.a(),best.acts);
  else botSay("Je n'ai pas la réponse à ça 😅 Le mieux est de demander directement à Fahim sur Discord, il répond sous 1 h.",[["Lui écrire sur Discord",()=>askQuote()]]);
}

// ordre d'affichage dans chaque thème : les questions qu'un client pose en premier d'abord
const QORDER=[
  "Tu fais quels types de vidéos ?","Tu fais du format vertical (TikTok, Reels) ?","Tu fais du motion design ?","Tu montes des streams / du gaming ?","Tu fais des vidéos pour des marques ?","Tu montes des vidéos de quelle durée ?","Tu fais l'étalonnage ?","Tu peux reprendre un montage commencé ?","Tu fais les miniatures ?","Tu filmes aussi ?","Il y a des sujets que tu refuses ?",
  "Combien ça coûte ?","Le devis est gratuit ?","Tu fais des forfaits ?","Tu demandes un acompte ?","Comment on te paie ?","Et si je veux plus de 3 retouches ?","Tu peux faire une facture ?",
  "Ça prend combien de temps ?","Il faut s'y prendre combien de temps à l'avance ?","Tu acceptes les commandes urgentes ?","Et si j'envoie mes rushes en retard ?","Tu réponds le week-end ?",
  "Comment on travaille ensemble ?","Les retouches sont incluses ?","Je peux voir l'avancement ?","Tu peux m'aider sur l'idée ?","Tu peux suivre le style de ma chaîne ?","Tu travailles avec les petites chaînes ?","Tu prends des clients réguliers ?","Tu bosses seul ou en équipe ?","Tu fais des vidéos test ?","Le projet peut rester confidentiel ?","Tu veux être crédité ?","Avec qui tu as déjà bossé ?",
  "Comment je t'envoie mes rushes ?","Tu livres en quelle qualité ?","Tu t'occupes du son ?","Tu ajoutes les sous-titres ?","Sous-titres en plusieurs langues ?","Tu crées des intros / outros ?","Tu fournis les fichiers sources ?","Tu utilises quels logiciels ?",
  "Comment te contacter ?","Tu es dispo en ce moment ?","Tu parles quelles langues ?"];
const qRank=q=>{ const i=QORDER.indexOf(q); return i<0?99:i; };
const chipsEl=document.getElementById("chat-chips");
function showCats(){
  chipsEl.className="chat-chips cats"; chipsEl.textContent="";
  QCATS.forEach(([id,ico,label])=>{
    const b=document.createElement("button"); b.type="button";
    b.textContent=label;
    b.onclick=()=>showQuestions(id,ico,label); chipsEl.appendChild(b);
  });
}
function showQuestions(id,ico,label){
  chipsEl.className="chat-chips qs"; chipsEl.textContent="";
  const back=document.createElement("button"); back.type="button"; back.className="q-back";
  back.textContent="Retour"; back.onclick=showCats;
  const head=document.createElement("div"); head.className="q-head"; head.append(back,Object.assign(document.createElement("b"),{textContent:label}));
  chipsEl.appendChild(head);
  FAQ.filter(f=>f.cat===id&&f.chip).sort((a,b)=>qRank(a.chip)-qRank(b.chip)).forEach(f=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=f.chip;
    b.onclick=()=>ask(f.chip); chipsEl.appendChild(b);
  });
}
showCats();
function openChat(){
  if(profileOpen) toggleProfile(false);
  chatOpen=true; chat.classList.add("open"); chat.setAttribute("aria-hidden","false"); aiBtn.setAttribute("aria-expanded","true");
  openSnd();
  if(!chatStarted){ chatStarted=true; botSay("Salut ! 👋 Je suis l'assistant de Fahim. Choisis une question ci-dessous ou écris la tienne."); }
  if(matchMedia("(pointer:fine)").matches) setTimeout(()=>chatIn.focus({preventScroll:true}),250);
}
function closeChat(){
  if(!chatOpen) return;
  chatOpen=false; chat.classList.remove("open"); chat.setAttribute("aria-hidden","true"); aiBtn.setAttribute("aria-expanded","false");
  backSnd();
}
aiBtn.addEventListener("click",e=>{ e.stopPropagation(); chatOpen?closeChat():openChat(); });
document.getElementById("chat-x").onclick=closeChat;
document.getElementById("chat-form").addEventListener("submit",e=>{
  e.preventDefault(); const q=chatIn.value.trim(); if(!q) return; chatIn.value=""; ask(q);
});
document.addEventListener("pointerdown",e=>{ if(chatOpen&&!chat.contains(e.target)&&!aiBtn.contains(e.target)) closeChat(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&chatOpen){ e.stopImmediatePropagation(); closeChat(); } },true);
// le chat se ferme si on ouvre le profil
orbHome.addEventListener("click",()=>{ if(chatOpen) closeChat(); });
function toggleProfile(open=!profileOpen){
  profileOpen=open;
  profile.classList.toggle("open",open);
  profile.setAttribute("aria-hidden",!open);
  orbHome.setAttribute("aria-expanded",open);
  if(open){ fetchProfile(); openSnd(); } else backSnd();
}
renderProfile(DISCORD);
fetchDiscordProfile();
document.getElementById("pf-avatar").onerror=document.getElementById("orb-pfp").onerror=function(){ if(this.src!==DISCORD.avatar) this.src=DISCORD.avatar; };
orbHome.addEventListener("click",e=>{ e.stopPropagation(); toggleProfile(); });
document.getElementById("pf-about").onclick=()=>{ toggleProfile(false); openChannel("about",orbHome); };
document.addEventListener("pointerdown",e=>{ if(profileOpen && !profile.contains(e.target) && !orbHome.contains(e.target)) toggleProfile(false); });

/* ---------- Horloge 7 segments ---------- */
const SEG={0:"abcdef",1:"bc",2:"abged",3:"abgcd",4:"fgbc",5:"afgcd",6:"afgedc",7:"abc",8:"abcdefg",9:"abcdfg"," ":""};
const P={a:"M5 2h18l-3 4H8z",b:"M24 4v20l-4-3V7z",c:"M24 28v20l-4-3V31z",d:"M5 50h18l-3-4H8z",e:"M4 28v20l4-3V31z",f:"M4 4v20l4-3V7z",g:"M6 26l3-2.5h10L22 26l-3 2.5H9z"};
function digit(ch){
  return `<svg class="seg" viewBox="0 0 28 52">${Object.entries(P).map(([k,d])=>`<path d="${d}" class="${SEG[ch].includes(k)?"on":""}"/>`).join("")}</svg>`;
}
function tick(){
  const d=new Date(), h=String(d.getHours()).padStart(2," "), m=String(d.getMinutes()).padStart(2,"0");
  document.getElementById("time").innerHTML = digit(h[0])+digit(h[1])+`<div class="colon"><i></i><i></i></div>`+digit(m[0])+digit(m[1]);
  const j=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
  document.getElementById("date").textContent = `${j[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
}
tick(); setInterval(tick,10000);

/* ---------- Main Wii animée ----------
   La position suit la souris sans retard (transform, mise à jour à chaque mouvement) ;
   seule l'inclinaison est lissée (balancier selon la vitesse horizontale), le clic est géré en CSS. */
if(matchMedia("(hover:hover) and (pointer:fine)").matches){
  const hand=document.createElement("div");
  hand.id="wii-hand"; hand.setAttribute("aria-hidden","true"); hand.innerHTML="<b><i></i></b>";
  document.body.appendChild(hand);
  const inner=hand.querySelector("i");
  new Image().src="cursors/wii-grab.png"; // préchargée : pas de clignotement au premier clic
  document.documentElement.classList.add("wii-cursor");

  let x=0,px=null,vel=0,tilt=0,prev=0,raf=0;
  const step=t=>{
    const dt=Math.min(50,t-(prev||t-16)); prev=t;
    const v=px===null?0:(x-px)/Math.max(dt,1)*16.7; px=x;              // px par image (base 60 Hz)
    vel+=(v-vel)*(1-Math.exp(-dt/70));                                // vitesse lissée
    const target=Math.max(-16,Math.min(16,vel*.9));
    tilt+=(target-tilt)*(1-Math.exp(-dt/110));                        // retour doux, sans rebond
    inner.style.transform=`rotate(${tilt.toFixed(2)}deg)`;
    if(Math.abs(tilt)<.05 && Math.abs(vel)<.05){ inner.style.transform=""; tilt=vel=0; raf=0; prev=0; return; }
    raf=requestAnimationFrame(step);
  };

  addEventListener("pointermove",e=>{
    if(e.pointerType!=="mouse") return;
    x=e.clientX;
    hand.style.transform=`translate3d(${x}px,${e.clientY}px,0)`;
    hand.classList.add("on");
    if(!raf && !reduce){ px=x; raf=requestAnimationFrame(step); }
  },{passive:true});
  addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse") hand.classList.add("down"); });
  addEventListener("pointerup",()=>hand.classList.remove("down"));
  // la souris quitte la fenêtre ou passe sur la vidéo YouTube : on cache la main
  document.addEventListener("pointerout",e=>{ if(!e.relatedTarget||e.relatedTarget.tagName==="IFRAME") hand.classList.remove("on"); });
  addEventListener("blur",()=>hand.classList.remove("on","down"));
}
</script>
